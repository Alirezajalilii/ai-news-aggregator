# AI News Aggregator Configuration
# Production-ready configuration for AI news aggregation system

app:
  name: "AI News Aggregator"
  version: "1.0.0"
  environment: "development"  # development, staging, production
  debug: true
  host: "0.0.0.0"
  port: 8000

database:
  host: "localhost"
  port: 5432
  name: "ai_news"
  username: "planchin"
  password: "dev_password"
  pool_size: 10
  max_overflow: 20
  echo: false

redis:
  host: "localhost"
  port: 6379
  db: 0
  password: null
  socket_timeout: 5
  max_connections: 50

telegram:
  bot_token: "7856786987:AAF6ikQ_C_VXDYO78CKW6V_X-US-PKS7w3U"
  allowed_users:
    - 6492129439  # Alireza
  admin_users:
    - 6492129439
  channels:
    - "@ainews_ramzbank"  # AI News Channel
  parse_mode: "HTML"
