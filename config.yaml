scraper:
  user_agent: "AI-News-Aggregator/1.0 (+https://github.com/example/ai-news-aggregator)"
  request_timeout: 30
  max_retries: 3
  retry_delay: 5
  batch_size: 5
  concurrency: 3
  default_fetch_strategy: "httpx"  # httpx, curl, ollama, brave
  sources:
    - name: "openai"
      url: "https://openai.com/blog"
      enabled: true
      priority: 1
      category: "company"
      fetch_strategy: "ollama"  # Try LLM extraction for Cloudflare-protected sites
      
    - name: "anthropic"
      url: "https://www.anthropic.com/news"
      enabled: true
      priority: 1
      category: "company"
      fetch_strategy: "httpx"
      
    - name: "google_ai"
      url: "https://blog.google/technology/ai/"
      enabled: true
      priority: 1
      category: "company"
      fetch_strategy: "httpx"
      
    - name: "huggingface"
      url: "https://huggingface.co/blog"
      enabled: true
      priority: 2
      category: "community"
      fetch_strategy: "httpx"
      
    - name: "marktechpost"
      url: "https://www.marktechpost.com/"
      enabled: true
      priority: 2
      category: "news"
      fetch_strategy: "httpx"
      
    - name: "techcrunch_ai"
      url: "https://techcrunch.com/category/artificial-intelligence/"
      enabled: true
      priority: 2
      category: "business"
      fetch_strategy: "httpx"
      
    - name: "venturebeat_ai"
      url: "https://venturebeat.com/category/ai/"
      enabled: true
      priority: 2
      category: "business"
      fetch_strategy: "curl"  # curl may bypass rate limiting
      
    - name: "mit_news_ai"
      url: "https://news.mit.edu/topic/artificial-intelligence"
      enabled: true
      priority: 3
      category: "research"
      fetch_strategy: "httpx"
      
    - name: "unite_ai"
      url: "https://www.unite.ai/"
      enabled: true
      priority: 3
      category: "news"
      fetch_strategy: "httpx"
      
    - name: "ai_news"
      url: "https://www.ainews.com/"
      enabled: true
      priority: 3
      category: "news"
      fetch_strategy: "httpx"
      
    - name: "the_verge_ai"
      url: "https://www.theverge.com/ai-artificial-intelligence"
      enabled: true
      priority: 3
      category: "news"
      fetch_strategy: "httpx"

news:
  summarization:
    enabled: true
    model: "minimax-m2.7:cloud"
    max_summary_length: 900
    min_summary_length: 400
    prompt_template: |
      Role: AI News Translator & Summarizer
      Task: You are a professional translator and news summarizer specializing in AI and technology news. Your job is to read the original English news article and produce a high-quality, engaging Persian (Farsi) summary.
      
      Input: English text — full article content about AI, technology, startups, research, or general news.
      
      Output: Persian (Farsi) summary, written in a journalistic style suitable for a Telegram news channel. The summary should be:
      - Between {min_len} to {max_len} characters (STRICT LIMIT - write enough to be informative, not too short)
      - Aim for 500-700 characters for proper depth
      - Written in informal but professional Persian (like a modern tech news outlet)
      - Written in RTL format with proper Persian numerals
      - Include one CTA at the end: "🔗 ادامه خبر در لینک"
      - Preserve all key facts: who, what, when, where, why
      - Add context when beneficial for Persian-speaking audience
      - Avoid literal translation — think in Persian
      
      Rules:
      1. Never exceed {max_len} characters
      2. Never cut sentences in the middle
      3. Always include the CTA link line
      4. Never add your own opinion or commentary
      5. Write as a native Persian journalist would, not as a translator
      
      Article:
      {content}
  deduplication:
    enabled: true
    similarity_threshold: 0.75
    title_similarity_weight: 0.4
    entity_similarity_weight: 0.4
    content_similarity_weight: 0.2
    max_age_hours: 48
    store_hash: true
    
  categories:
    - id: "model"
      name: "🤖 مدل‌های جدید"
      emoji: "🤖"
      
    - id: "company"
      name: "🏢 شرکت‌ها"
      emoji: "🏢"
      
    - id: "startup"
      name: "💰 استارتاپ/سرمایه‌گذاری"
      emoji: "💰"
      
    - id: "research"
      name: "🔬 تحقیقات"
      emoji: "🔬"
      
    - id: "tool"
      name: "⚡ ابزارها"
      emoji: "⚡"
      
    - id: "general"
      name: "📰 عمومی"
      emoji: "📰"

scheduler:
  enabled: true
  timezone: "Asia/Tehran"
  
  jobs:
    - name: "fetch_all_sources"
      schedule: "0/15 * * * *"  # Every 4 hours
      description: "Fetch news from all sources"
      enabled: true
      
    - name: "cleanup_old_news"
      schedule: "0 3 * * *"  # Daily at 3 AM
      description: "Clean up news older than 7 days"
      enabled: true
      
    - name: "send_digest"
      schedule: "0/15 * * * *"  # 8AM, 12PM, 6PM, 10PM
      description: "Send news digest to subscribed channels"
      enabled: true

telegram_bot:
  commands:
    - command: "start"
      description: "Start the bot"
      
    - command: "help"
      description: "Get help"
      
    - command: "latest"
      description: "Get latest news"
      
    - command: "subscribe"
      description: "Subscribe to digest"
      
    - command: "unsubscribe"
      description: "Unsubscribe from digest"
      
    - command: "stats"
      description: "Get statistics"
      
    - command: "search"
      description: "Search news"
      
  filters:
    min_title_length: 10
    max_title_length: 200
    min_summary_length: 50
    max_summary_length: 500
    
  formatting:
    max_articles_per_message: 10
    include_source: true
    include_timestamp: true
    include_categories: true
    link_preview: false

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/app.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5
  sentry_dsn: null  # Optional Sentry integration

monitoring:
  enabled: true
  health_check_interval: 60
  metrics_port: 9090
  prometheus_enabled: false
