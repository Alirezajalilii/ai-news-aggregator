# =============================================================================
# AI News Aggregator - Production Overrides
# Apply on top of docker-compose.yml for production deployments.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  app:
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    restart: always
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.5"
        reservations:
          memory: 384M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "ainews-app|{{.Name}}"
    # Remove source mount in production — use built-in config
    volumes:
      - app-logs:/app/logs
    # Don't expose healthcheck port externally in production
    ports: []

  postgres:
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"
    # Don't expose PostgreSQL port externally in production
    ports: []
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
        tag: "ainews-postgres|{{.Name}}"

  redis:
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:-}
    restart: always
    deploy:
      resources:
        limits:
          memory: 320M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"
    # Don't expose Redis port externally in production
    ports: []
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        tag: "ainews-redis|{{.Name}}"